name: Build BRUCE APK
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: bruce-android-apk
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Download offline Portuguese wake-word model
        run: |
          mkdir -p app/src/main/assets
          curl -L --fail --retry 3 https://alphacephei.com/vosk/models/vosk-model-small-pt-0.3.zip -o /tmp/vosk-model.zip
          unzip -q /tmp/vosk-model.zip -d /tmp/vosk
          mv /tmp/vosk/vosk-model-small-pt-0.3 app/src/main/assets/model-pt
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: BRUCE-Android-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
